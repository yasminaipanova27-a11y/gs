<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GlobalStudent Hub — Your New City. Your Home. Your People.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --text:#0E1220; --muted:#6B7280; --line:#E8EAF2;
  --accent:#5B4BFF; --accent-2:#8B7BFF; --accent-soft:#EEECFF;
  --green:#12B76A; --green-soft:#E7F8F0; --blue:#2E90FA; --blue-soft:#E8F2FE;
  --amber:#F79009; --amber-soft:#FFF6E5;
  --radius:20px; --radius-sm:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 26px rgba(16,24,40,.06);
  --shadow-lg:0 12px 40px rgba(16,24,40,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);line-height:1.5;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:86px;
}
@media(min-width:900px){body{padding-bottom:0}}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;line-height:1.2}
p{margin:0}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.accent{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;width:100%}
.narrow{max-width:640px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fade-in{animation:fade .32s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

/* ---------- HEADER ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(246,247,251,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;gap:12px;height:62px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.03em;cursor:pointer;user-select:none}
.logo-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 16px rgba(91,75,255,.32)}
.nav-links{display:none;margin-left:auto;gap:2px}
@media(min-width:980px){.nav-links{display:flex}}
.nav-links button{background:none;border:0;padding:9px 13px;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);transition:.16s}
.nav-links button:hover{background:#fff;color:var(--text)}
.nav-links button.active{background:var(--accent-soft);color:var(--accent)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
@media(min-width:980px){.topbar-right{margin-left:10px}}

/* ---------- BOTTOM NAV ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
@media(min-width:900px){.bottomnav{display:none}}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:7px 2px;border-radius:14px;color:var(--muted);font-size:10.5px;font-weight:600;transition:.16s}
.bottomnav button svg{width:22px;height:22px}
.bottomnav button.active{color:var(--accent);background:var(--accent-soft)}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;border:1px solid transparent;font-size:14.5px;font-weight:650;transition:.18s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(91,75,255,.28)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(91,75,255,.36)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:#D6D9E8;transform:translateY(-1px)}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-soft:hover{background:#E3E0FF}
.btn-danger{background:#FEF0F0;color:#D92D20}
.btn-sm{padding:9px 14px;font-size:13.5px;border-radius:12px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* ---------- CARDS / CHIPS ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.16s}
.chip:hover{border-color:#D6D9E8}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;margin:0 -16px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:650}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.01em}
.badge-green{background:var(--green-soft);color:#087443}
.badge-blue{background:var(--blue-soft);color:#175CD3}
.badge-amber{background:var(--amber-soft);color:#B54708}
.badge-grey{background:#F1F2F7;color:#5A6178}
.tag{display:inline-block;padding:5px 11px;border-radius:10px;background:#F4F5FA;color:#4A5068;font-size:12px;font-weight:600}

.avatar{width:44px;height:44px;border-radius:50%;background:var(--c,#EEF0FF);color:#39405A;display:grid;place-items:center;font-weight:750;font-size:15px;flex:none;letter-spacing:-.02em}
.avatar.lg{width:62px;height:62px;font-size:20px}
.avatar.sm{width:34px;height:34px;font-size:12.5px}
.avatar.xs{width:26px;height:26px;font-size:10.5px;border:2px solid #fff}
.avatar-stack{display:flex}
.avatar-stack .avatar{margin-left:-9px;border:2px solid #fff}
.avatar-stack .avatar:first-child{margin-left:0}

.ring{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),#EDEEF5 0);position:relative}
.ring::after{content:'';position:absolute;inset:5px;background:#fff;border-radius:50%}
.ring b{position:relative;z-index:1;font-size:13px;font-weight:800;color:var(--accent)}

.progress{height:8px;border-radius:99px;background:#EDEEF5;overflow:hidden;margin:10px 0 8px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s cubic-bezier(.3,1,.4,1)}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr}
@media(min-width:680px){.g2{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.g3{grid-template-columns:repeat(3,1fr)}}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec-title h2{font-size:19px}
.sec-title button{background:none;border:0;color:var(--accent);font-size:13.5px;font-weight:650;padding:0}
.page-head{margin:22px 0 16px}
.page-head h1{font-size:26px;margin-bottom:6px}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;padding:34px 0 10px}
.hero::before{content:'';position:absolute;top:-260px;right:-180px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(91,75,255,.20),transparent 65%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-320px;left:-220px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(139,123,255,.16),transparent 65%);pointer-events:none}
.hero-inner{position:relative;display:grid;gap:34px}
@media(min-width:980px){.hero-inner{grid-template-columns:1.05fr .95fr;align-items:center;gap:40px;padding:36px 0 46px}}
.hero h1{font-size:clamp(34px,9vw,60px);font-weight:800;letter-spacing:-.035em;margin:16px 0 14px}
.grad{background:linear-gradient(105deg,var(--accent),#9C8BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:16.5px;color:var(--muted);max-width:520px;line-height:1.62}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 26px}
.hero-stats{display:flex;gap:28px}
.hero-stats strong{display:block;font-size:21px;font-weight:800;letter-spacing:-.03em}
.hero-stats span{font-size:12.5px;color:var(--muted)}

.hero-visual{position:relative;height:400px}
@media(min-width:980px){.hero-visual{height:470px}}
.hv{position:absolute;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:12px 14px;animation:float 6s ease-in-out infinite}
.hv-map{left:0;top:6%;width:62%;padding:14px;animation-delay:.1s}
.hv-map-head{font-size:11.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.hv-map-head .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.hv-map-body{position:relative;height:150px;border-radius:12px;background:
  linear-gradient(#EDEFF7 1px,transparent 1px) 0 0/26px 26px,
  linear-gradient(90deg,#EDEFF7 1px,transparent 1px) 0 0/26px 26px,
  linear-gradient(140deg,#F7F8FD,#EEF0FB);overflow:hidden}
.hv-map-body svg{position:absolute;inset:0;width:100%;height:100%}
.hv-map-body path{fill:none;stroke:var(--accent);stroke-width:1.1;stroke-dasharray:3 3;opacity:.5}
.pin{position:absolute;width:26px;height:26px;border-radius:9px;background:#fff;display:grid;place-items:center;font-size:13px;box-shadow:0 4px 12px rgba(16,24,40,.16);border:1px solid var(--line)}
.pin.p1{left:12%;top:18%} .pin.p2{left:62%;top:12%} .pin.p3{left:24%;top:62%} .pin.p4{left:70%;top:66%}
.hv-match{right:0;top:0;display:flex;align-items:center;gap:10px;animation-delay:.9s}
.hv-match b{font-size:13px;display:block}
.hv-match span{font-size:11.5px;color:var(--accent);font-weight:700}
.hv-apt{right:2%;bottom:16%;display:flex;align-items:center;gap:11px;animation-delay:1.7s}
.hv-apt .thumb{width:42px;height:42px;border-radius:12px;background:linear-gradient(140deg,#EEECFF,#DCD8FF);display:grid;place-items:center;font-size:20px}
.hv-apt b{font-size:12.5px;display:block}
.hv-apt span{font-size:11.5px;color:var(--muted)}
.hv-people{left:4%;bottom:2%;display:flex;align-items:center;gap:10px;animation-delay:2.4s}
.hv-people b{font-size:12.5px;display:block}
.hv-people span{font-size:11.5px;color:var(--muted)}

/* ---------- FEATURES ---------- */
.feature{display:flex;gap:14px;align-items:flex-start}
.feature .fi{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);display:grid;place-items:center;font-size:20px;flex:none}
.feature h3{font-size:15.5px;margin-bottom:4px}
.feature p{font-size:13.5px;color:var(--muted);line-height:1.55}

/* ---------- STEPS ---------- */
.steps{display:grid;gap:10px;counter-reset:s}
.step{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.step .n{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13.5px;flex:none}
.step b{font-size:14.5px;display:block}
.step span{font-size:13px;color:var(--muted)}

/* ---------- LISTINGS ---------- */
.listing{overflow:hidden;padding:0;display:flex;flex-direction:column;transition:.2s}
.listing:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.listing-img{height:158px;position:relative;display:grid;place-items:center;font-size:48px;background:linear-gradient(140deg,#EEECFF,#DCD8FF)}
.listing-img .badges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.listing-img .save{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.94);display:grid;place-items:center;font-size:16px;box-shadow:0 4px 12px rgba(16,24,40,.14)}
.listing-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.listing-body h3{font-size:16px}
.price{font-size:19px;font-weight:800;letter-spacing:-.03em}
.price span{font-size:13px;font-weight:600;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.amenity-list{display:flex;flex-wrap:wrap;gap:6px}
.amenity-list span{font-size:12px;font-weight:600;color:#4A5068;background:#F4F5FA;padding:5px 10px;border-radius:9px}

/* ---------- MAP VIEW ---------- */
.mapview{position:relative;height:440px;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;background:
  linear-gradient(#E9EBF4 1px,transparent 1px) 0 0/38px 38px,
  linear-gradient(90deg,#E9EBF4 1px,transparent 1px) 0 0/38px 38px,
  linear-gradient(140deg,#FAFBFF,#EEF0FB);box-shadow:var(--shadow)}
.mapview .mpin{position:absolute;transform:translate(-50%,-100%);background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12.5px;font-weight:700;box-shadow:0 6px 18px rgba(16,24,40,.16);white-space:nowrap}
.mapview .mpin.v{border-color:#B7E9CE;background:#F3FDF8}

/* ---------- ROOMMATE CARD ---------- */
.rc-head{display:flex;gap:13px;align-items:center;margin-bottom:12px}
.rc-head h3{font-size:16px}
.rc-head p{font-size:13px;color:var(--muted)}
.pros,.cons{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.pros li,.cons li{font-size:13.2px;display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.pros li::before{content:'✓';color:var(--green);font-weight:800;flex:none}
.cons li::before{content:'⚠';color:var(--amber);flex:none}
.rc-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.rc-actions .btn{flex:1;min-width:78px;padding:10px 12px;font-size:13px}

/* ---------- ONBOARDING ---------- */
.onb-shell{padding:26px 0 40px}
.q-icon{width:58px;height:58px;border-radius:18px;background:var(--accent-soft);display:grid;place-items:center;font-size:27px;margin-bottom:14px}
.q-card h2{font-size:22px;margin-bottom:6px}
.q-options{display:grid;gap:10px;margin-top:20px}
.q-option{text-align:left;padding:16px 18px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:600;transition:.16s}
.q-option:hover{border-color:var(--accent);background:#FBFAFF;transform:translateX(3px)}
.q-option.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:650;color:#3C4257}
.field input,.field select{padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);background:#fff;outline:none;transition:.16s;width:100%}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,75,255,.12)}
.two-col{display:grid;gap:0 14px}
@media(min-width:600px){.two-col{grid-template-columns:1fr 1fr}}

/* ---------- COMMUNITY ---------- */
.post{padding:16px}
.post-head{display:flex;gap:11px;align-items:center;margin-bottom:11px}
.post-head b{font-size:14.5px;display:block}
.post-head span{font-size:12.5px;color:var(--muted)}
.post h3{font-size:15.5px;margin-bottom:6px}
.post p{font-size:14px;color:#4A5068;line-height:1.6}
.post-actions{display:flex;gap:16px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.post-actions button{background:none;border:0;font-size:13px;font-weight:650;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0}
.post-actions button.liked{color:var(--accent)}

/* ---------- EVENTS ---------- */
.event{display:flex;gap:14px;align-items:flex-start}
.event .date{width:58px;flex:none;text-align:center;border-radius:14px;background:var(--accent-soft);padding:9px 0}
.event .date b{display:block;font-size:19px;font-weight:800;color:var(--accent);line-height:1}
.event .date span{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase}
.event h3{font-size:15.5px;margin-bottom:5px}
.event .meta-line{font-size:12.8px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px}

/* ---------- MESSAGES ---------- */
.thread-item{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:.16s;width:100%;text-align:left}
.thread-item:hover{border-color:#D6D9E8;transform:translateY(-1px)}
.chat{display:flex;flex-direction:column;height:calc(100vh - 250px);min-height:380px}
.chat-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px 0}
.bubble{max-width:78%;padding:11px 15px;border-radius:17px;font-size:14.2px;line-height:1.5}
.bubble.them{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.bubble.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.chat-input{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.chat-input input{flex:1;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);outline:none}
.chat-input input:focus{border-color:var(--accent)}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;z-index:200;background:rgba(14,18,32,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){#modal{align-items:center;padding:24px}}
.modal-sheet{background:#fff;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));animation:slideUp .28s cubic-bezier(.3,1,.4,1)}
@media(min-width:700px){.modal-sheet{border-radius:26px}}
.modal-close{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;border:0;background:#F4F5FA;font-size:16px;color:#5A6178;display:grid;place-items:center}

/* ---------- PROFILE ---------- */
.profile-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 18px}
@media(min-width:600px){.profile-hero{flex-direction:row;text-align:left;gap:18px;padding:22px}}
.lifestyle-grid{display:grid;gap:10px}
@media(min-width:600px){.lifestyle-grid{grid-template-columns:1fr 1fr}}
.ls-item{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:13px;background:#FAFBFF;border:1px solid var(--line);font-size:13.5px}
.ls-item b{font-weight:650}

footer.site{margin-top:44px;padding:28px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="logo" data-action="go" data-view="landing">
      <div class="logo-mark">G</div>
      <span>GlobalStudent<span class="accent">Hub</span></span>
    </div>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="topbar-right" id="topbarRight"></div>
  </div>
</header>

<main id="app"></main>

<nav class="bottomnav" id="bottomNav"></nav>
<div id="modal" class="hidden"></div>

<script>
/* ==========================================================
   DATA
========================================================== */
const QUESTIONS = [
  {id:'cleanliness',icon:'✨',title:'Cleanliness',q:'How important is a clean apartment to you?',
   options:['Very important','Important','Flexible'],weight:1.3,
   same:'Both prefer a clean apartment',diff:'Different cleanliness standards'},
  {id:'noise',icon:'🔊',title:'Noise level',q:'How much noise can you handle at home?',
   options:['I prefer complete silence','Moderate noise is okay','I don’t mind noise'],weight:1.2,
   same:'Similar noise preferences',diff:'Different noise tolerance'},
  {id:'sleep',icon:'🌙',title:'Sleep schedule',q:'When do you usually sleep?',
   options:['Early bird','Normal schedule','Night owl'],weight:1.3,
   same:'Similar sleep schedule',diff:'Different sleep schedules'},
  {id:'guests',icon:'🚪',title:'Guests',q:'How often do you have guests over?',
   options:['I rarely have guests','Occasionally','Frequently'],weight:1.0,

function initials(n){return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function avatarHTML(name,color,cls=''){return '<div class="avatar '+cls+'" style="--c:'+(color||'#EEF0FF')+'">'+initials(name)+'</div>';}
function money(n){return '₸'+Number(n).toLocaleString('en-US');}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function compat(userAns, otherAns){
  let sum=0,wsum=0;
  QUESTIONS.forEach(q=>{
    const w=q.weight||1, a=userAns[q.id], b=otherAns[q.id];
    let s;
    if(a===undefined||b===undefined){s=0.7;}
    else{const d=Math.abs(a-b); s = d===0?1 : d===1?0.62 : 0.24;}
    sum+=s*w; wsum+=w;
  });
  return Math.round((sum/wsum)*100);
}
function sharedAndDiff(userAns, otherAns){
  const same=[],diff=[];
  QUESTIONS.forEach(q=>{
    const a=userAns[q.id], b=otherAns[q.id];
    if(a===undefined||b===undefined) return;
    if(a===b) same.push(q.same); else diff.push(q.diff);
  });
  return {same:same.slice(0,4),diff:diff.slice(0,2)};
}
function matchedStudents(){
  const mine = state.answers;
  return STUDENTS
    .filter(s=>!state.passed.includes(s.id))
    .map(s=>({...s, score:compat(mine,s.answers)}))
    .sort((a,b)=>b.score-a.score);
}
function listingById(id){return LISTINGS.find(l=>l.id===id);}
function studentById(id){return STUDENTS.find(s=>s.id===id);}

/* ---------- ONBOARDING ---------- */
function viewOnboarding(){
  const o = state.onb;
  const total = QUESTIONS.length + 2;
  const pct = Math.round((o.step/(total-1))*100);

  if(o.step===0) return onbBasic(pct);
  if(o.step<=QUESTIONS.length) return onbQuestion(pct);
  return onbResult(pct);
}

function onbHeader(pct,label){
  return `<div style="margin-bottom:18px">
    <div class="between" style="margin-bottom:8px">
      <span class="muted small" style="font-weight:650">${label}</span>
      <span class="muted small">${pct}%</span>
    </div>
    <div class="progress" style="margin:0"><i style="width:${pct}%"></i></div>
  </div>`;
}

function onbBasic(pct){
  const d = state.onb.data;
  return `<div class="wrap narrow onb-shell">
    ${onbHeader(pct,'Step 1 · Basic information')}
    <div class="card">
      <h2 style="font-size:22px;margin-bottom:6px">Tell us about you</h2>
      <p class="muted small" style="margin-bottom:20px">This helps us show the right apartments and people. Nothing is public by default.</p>
      <div class="two-col">
        <div class="field"><label>Name</label><input data-field="name" value="${esc(d.name)}" placeholder="Yasmin"></div>
        <div class="field"><label>Age</label><input data-field="age" type="number" value="${esc(d.age)}" placeholder="21"></div>
      </div>
      <div class="field"><label>University</label>
        <select data-field="university">
          ${['Astana IT University','Nazarbayev University','Kazakh-British Technical University','Eurasian National University','Other'].map(u=>'<option '+(d.university===u?'selected':'')+'>'+u+'</option>').join('')}
        </select>
      </div>
      <div class="two-col">
        <div class="field"><label>City</label><input data-field="city" value="${esc(d.city)}" placeholder="Astana"></div>
        <div class="field"><label>Country</label><input data-field="country" value="${esc(d.country)}" placeholder="Kazakhstan"></div>
      </div>
      <div class="two-col">
        <div class="field"><label>Study program</label><input data-field="program" value="${esc(d.program)}" placeholder="Computer Science"></div>
        <div class="field"><label>Year of study</label>
          <select data-field="year">
            ${['1st year','2nd year','3rd year','4th year','Master’s'].map(y=>'<option '+(d.year===y?'selected':'')+'>'+y+'</option>').join('')}
          </select>
        </div>
      </div>
      <div class="two-col">
        <div class="field"><label>Move-in date</label><input data-field="moveIn" type="date" value="${esc(d.moveIn)}"></div>
        <div class="field"><label>Length of stay</label>
          <select data-field="stay">
            ${['1 semester','6 months','10 months','1 year','2+ years'].map(s=>'<option '+(d.stay===s?'selected':'')+'>'+s+'</option>').join('')}
          </select>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:16px;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" data-action="onb-next">Continue →</button>
      <button class="btn btn-ghost" data-action="onb-demo">Use demo profile</button>
    </div>
    <p class="muted small" style="margin-top:14px">🔒 Your data is used only for matching. You control what's visible on your profile.</p>
  </div>`;
}

function onbQuestion(pct){
  const q = QUESTIONS[state.onb.step-1];
  const cur = state.onb.answers[q.id];
  return `<div class="wrap narrow onb-shell">
    ${onbHeader(pct,'Lifestyle · Question '+state.onb.step+' of '+QUESTIONS.length)}
    <div class="card q-card">
      <div class="q-icon">${q.icon}</div>
      <h2>${q.title}</h2>
      <p class="muted">${q.q}</p>
      <div class="q-options">
        ${q.options.map((o,i)=>`<button class="q-option ${cur===i?'selected':''}" data-action="answer" data-q="${q.id}" data-i="${i}">${o}</button>`).join('')}
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn btn-ghost" data-action="onb-back">← Back</button>
    </div>
  </div>`;
}

function lifestyleTitle(a){
  const adj=[];
  if(a.cleanliness===0) adj.push('Tidy'); else if(a.cleanliness===2) adj.push('Easy-going');
  if(a.noise===0) adj.push('Quiet'); else if(a.noise===2) adj.push('Noise-proof');
  if(a.sleep===0) adj.push('Early Bird'); else if(a.sleep===2) adj.push('Night Owl');
  if(a.social===2) adj.push('Social'); else if(a.social===0) adj.push('Private');
  const top = adj.slice(0,2);
  if(!top.length) top.push('Balanced','Flexible');
  if(top.length===1) top.push('Student');
  return 'The '+top[0]+' &amp; '+top[1];
}

function onbResult(pct){
  const a = state.onb.answers;
  const rows = QUESTIONS.map(q=>{
    const v = a[q.id];
    return `<div class="ls-item"><span>${q.icon} ${q.title}</span><b>${v===undefined?'—':q.options[v]}</b></div>`;
  }).join('');

  return `<div class="wrap narrow onb-shell">
    ${onbHeader(100,'Your lifestyle profile')}
    <div class="card" style="text-align:center;padding:26px 18px">
      <div style="font-size:44px;margin-bottom:8px">✨</div>
      <p class="muted small" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Lifestyle profile</p>
      <h2 style="font-size:26px;margin:8px 0 10px">${lifestyleTitle(a)}</h2>
      <p class="muted" style="max-width:440px;margin:0 auto">We'll use this to calculate compatibility with other students and to recommend apartments that fit how you actually live.</p>
    </div>
    <div class="sec-title"><h2>Your answers</h2></div>
    <div class="lifestyle-grid">${rows}</div>
    <div class="row" style="margin-top:22px;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" data-action="onb-finish">Go to my dashboard →</button>
      <button class="btn btn-ghost" data-action="onb-restart">Redo questionnaire</button>
    </div>
  </div>`;
}

/* ---------- DASHBOARD ---------- */
function profileCompletion(){
  if(!state.onboarded) return 0;
  let done = 1;
  if(Object.keys(state.answers).length >= QUESTIONS.length) done += 1;
  if(state.profile.name) done += 1;
  if(state.profile.university) done += 1;
  return Math.min(100, Math.round((done/4)*100));
}

function viewDashboard(){
  const name = (state.profile.name||'Yasmin').split(' ')[0];
  const comp = profileCompletion();
  const recApts = LISTINGS.filter(l=>l.vApartment&&l.vLandlord).slice(0,3);
  const recMates = matchedStudents().slice(0,3);
  const evs = EVENTS.slice(0,2);
  const posts = state.posts.slice(0,2);
  const tips = GUIDE.practical.items.slice(0,3);
  const savedListings = state.saved.map(listingById).filter(Boolean);

  return `<div class="wrap">
    <div class="dash-head page-head between" style="flex-wrap:wrap">
      <div>
        <h1>Welcome, ${esc(name)} 👋</h1>

    <div class="card">
      <div class="between"><b>Your profile: ${comp}% complete</b><span class="muted small">${comp>=100?'All set 🎉':'Almost there'}</span></div>
      <div class="progress"><i style="width:${comp}%"></i></div>
      <p class="muted small">${comp<100?'Complete your lifestyle questionnaire to improve roommate recommendations.':'Your lifestyle profile is powering your matches.'}</p>

    <div class="grid g3">${recApts.map(listingCard).join('')}</div>

    <div class="grid g2">${recMates.map(roommateCard).join('')}</div>

    <div class="sec-title"><h2>Upcoming events</h2><button data-action="go" data-view="events">See all</button></div>

    <div class="sec-title"><h2>Local tips for Astana</h2><button data-action="go" data-view="guides">Full guide</button></div>
    <div class="grid g3">
      ${tips.map(t=>'<div class="card"><h3 style="font-size:15px;margin-bottom:6px">'+t.t+'</h3><p class="muted small">'+t.d+'</p></div>').join('')}

    ${savedListings.length?`<div class="sec-title"><h2>Saved listings</h2></div><div class="grid g3">${savedListings.map(listingCard).join('')}</div>`:''}

    <div class="sec-title"><h2>Messages</h2><button data-action="go" data-view="messages">Open inbox</button></div>

          </div>

/* ---------- LISTING CARD ---------- */
function listingCard(l){
  const saved = state.saved.includes(l.id);
  return `<div class="card listing">
    <div class="listing-img" style="background:linear-gradient(140deg,${l.color},#FFFFFF)">
      <span>${l.emoji}</span>
      <div class="badges">
        ${l.vApartment?'<span class="badge badge-green">🟢 Verified apartment</span>':''}
        ${l.vLandlord?'<span class="badge badge-blue">🔵 Verified landlord</span>':''}
        ${(!l.vApartment&&!l.vLandlord)?'<span class="badge badge-grey">Not verified</span>':''}
      </div>
      <button class="save" data-action="save-listing" data-id="${l.id}" title="Save">${saved?'❤️':'🤍'}</button>
    </div>
    <div class="listing-body">
      <h3>${esc(l.title)}</h3>
      <p class="muted small">📍 ${esc(l.area)}
